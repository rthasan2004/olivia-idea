backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"
site_url: /
display_url: /
logo_url: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=200&q=80"

publish_mode: simple

collections:
  - name: "content"
    label: "Website Content"
    files:
      - name: "posts"
        label: "Blog Posts"
        file: "data/posts.json"
        format: "json"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Nail", "Fashion"]
              - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Featured Image", name: "image", widget: "image" }
              - { label: "Short Description", name: "excerpt", widget: "text" }
              - { label: "Article Content", name: "body", widget: "markdown" }
